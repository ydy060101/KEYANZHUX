[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-backend"
version = "0.1.0"
description = "Research assistant agent backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3.6,<1",
    "httpx>=0.28,<0.29",
    "redis>=5.2,<7",
    "arq>=0.26,<1",
    "python-multipart>=0.0.12,<1",
    "pymupdf>=1.24,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=3,<6",
]

# OCR for scanned pages (T2.4). Optional because the stack pulls a ~500MB
# runtime and several pinned wheels; without it a scan parses as having no text
# and the worker logs a warning instead of failing (H08).
[project.optional-dependencies]
ocr = [
    "paddlepaddle==3.2.0",
    "paddleocr==3.7.0",
    "paddlex==3.7.2",
    # paddlex gates its OCR pipeline on this exact opencv version.
    "opencv-contrib-python==4.10.0.84",
    "albumentations==2.0.8",
    "albucore==0.0.24",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "types-requests",
    # Peak-RSS sampling for the H11 long-book check (T2.5).
    "psutil>=7,<8",
    "types-psutil>=7,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
# The app package is first-party even though it is not installed at the root.

target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf", "pgvector.*", "arq.*", "redis.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `slow` marks the measurements that need the 541-page book (T2.5): they take
# minutes, so they are excluded from the default run and invoked explicitly
# with `-m slow`. Excluding them by default keeps `tools.ps1 accept` honest —
# a suite that takes ten minutes is a suite people stop running.
addopts = "-q -m 'not slow'"
markers = [
    "slow: needs the 541-page fixture and takes minutes (run with -m slow)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
